<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Star Battle</title>
<style>
  body { margin: 0; overflow: hidden; background: #000; font-family: Tahoma; }
  canvas { display: block; }
  #ui { position: absolute; bottom: 20px; width: 100%; display: flex; justify-content: space-between; padding: 0 20px; box-sizing: border-box; z-index: 10; pointer-events: none; }
  .btn { width: 80px; height: 80px; border-radius: 50%; border: 3px solid #fff; font-size: 16px; font-weight: bold; color: #fff; display: flex; justify-content: center; align-items: center; pointer-events: auto; background: rgba(255,255,255,0.2); }
  #info { position: absolute; top: 20px; width: 100%; text-align: center; color: #fff; font-size: 20px; text-shadow: 2px 2px 4px #000; z-index: 10; pointer-events: none; }
</style>
</head>
<body>

<canvas id="game-canvas"></canvas>
<div id="info">امتیاز: 0</div>
<div id="ui">
  <div></div>
</div>

<script>
const canvas = document.getElementById('game-canvas') || document.createElement('canvas');
canvas.id = 'game-canvas';
document.body.appendChild(canvas);
const ctx = canvas.getContext('2d');

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

const player = { x: canvas.width / 2, y: canvas.height - 100, size: 40, speed: 7, hp: 10 };
const bullets = [];
const enemies = [];
const keys = { ArrowLeft: false, ArrowRight: false, ArrowUp: false, ArrowDown: false, Space: false };
let score = 0;
let enemySpawnTimer = 0;

window.addEventListener('keydown', (e) => {
  if (e.key in keys) keys[e.key] = true;
  if (e.key === ' ' || e.key === 'Spacebar') keys.Space = true;
});

window.addEventListener('keyup', (e) => {
  if (e.key in keys) keys[e.key] = false;
  if (e.key === ' ' || e.key === 'Spacebar') keys.Space = false;
});

function update() {
  if (keys.ArrowLeft) player.x -= player.speed;
  if (keys.ArrowRight) player.x += player.speed;
  if (keys.ArrowUp) player.y -= player.speed;
  if (keys.ArrowDown) player.y += player.speed;

  player.x = Math.max(0, Math.min(canvas.width - player.size, player.x));
  player.y = Math.max(0, Math.min(canvas.height - player.size, player.y));

  if (keys.Space) {
    bullets.push({ x: player.x + player.size/2, y: player.y, w: 4, h: 15, speed: 10 });
    keys.Space = false; // shoot one bullet per press
  }

  for (let i = bullets.length - 1; i >= 0; i--) {
    bullets[i].y -= bullets[i].speed;
    if (bullets[i].y < 0) bullets.splice(i, 1);
  }

  enemySpawnTimer++;
  if (enemySpawnTimer > 60) {
    enemies.push({ x: Math.random() * (canvas.width - 40), y: -40, size: 40, speed: 2 + Math.random() * 2 });
    enemySpawnTimer = 0;
  }

  for (let i = enemies.length - 1; i >= 0; i--) {
    enemies[i].y += enemies[i].speed;
    
    // Check collision with player
    if (
      enemies[i].x < player.x + player.size &&
      enemies[i].x + enemies[i].size > player.x &&
      enemies[i].y < player.y + player.size &&
      enemies[i].y + enemies[i].size > player.y
    ) {
      enemies.splice(i, 1);
      player.hp--;
      if (player.hp <= 0) {
        alert('بازی تموم شد! امتیاز: ' + score);
        window.location.reload();
      }
      continue;
    }

    if (enemies[i].y > canvas.height) enemies.splice(i, 1);
  }

  // Check bullet-enemy collision
  for (let i = bullets.length - 1; i >= 0; i--) {
    for (let j = enemies.length - 1; j >= 0; j--) {
      if (
        bullets[i].x < enemies[j].x + enemies[j].size &&
        bullets[i].x + bullets[i].w > enemies[j].x &&
        bullets[i].y < enemies[j].y + enemies[j].size &&
        bullets[i].y + bullets[i].h > enemies[j].y
      ) {
        bullets.splice(i, 1);
        enemies.splice(j, 1);
        score += 10;
        document.getElementById('info').innerText = 'امتیاز: ' + score;
        break;
      }
    }
  }
}

function draw() {
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Draw player (Spaceship)
  ctx.fillStyle = '#50dcdc';
  ctx.beginPath();
  ctx.moveTo(player.x + player.size/2, player.y);
  ctx.lineTo(player.x, player.y + player.size);
  ctx.lineTo(player.x + player.size, player.y + player.size);
  ctx.closePath();
  ctx.fill();

  // Draw bullets
  ctx.fillStyle = '#ffdc3c';
  for (const b of bullets) {
    ctx.fillRect(b.x, b.y, b.w, b.h);
  }

  // Draw enemies
  ctx.fillStyle = '#ff3232';
  for (const e of enemies) {
    ctx.fillRect(e.x, e.y, e.size, e.size);
  }

  // Draw HP
  ctx.fillStyle = '#fff';
  ctx.font = '20px Tahoma';
  ctx.fillText('HP: ' + player.hp, 20, 30);
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
