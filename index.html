<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Space Base 3D</title>
<style>
  body { margin: 0; overflow: hidden; background: #000; font-family: Tahoma; touch-action: none; }
  canvas { display: block; }
  
  /* دکمه شیشه‌ای FIRE */
  #btn-fire { 
    position: absolute; bottom: 40px; right: 30px; width: 90px; height: 90px; 
    border-radius: 50%; border: 3px solid rgba(255, 80, 80, 0.8);
    background: rgba(255, 0, 0, 0.2); backdrop-filter: blur(5px);
    color: #fff; font-weight: bold; font-size: 18px;
    display: flex; justify-content: center; align-items: center;
    z-index: 10; box-shadow: 0 0 20px rgba(255,0,0,0.4);
    touch-action: none;
  }
  #btn-fire:active { background: rgba(255, 0, 0, 0.6); transform: scale(0.95); }

  /* ناحیه جوی‌استیک (شفاف) */
  #joystick-zone {
    position: absolute; bottom: 20px; left: 20px; width: 150px; height: 150px;
    z-index: 10; touch-action: none;
    /* برای تست دیده میشه، در نسخه نهایی میتونی شفافش کنی */
    background: rgba(255, 255, 255, 0.05); border-radius: 50%;
  }
  /* دسته جوی‌استیک */
  #joystick-knob {
    position: absolute; top: 45px; left: 45px; width: 60px; height: 60px;
    background: rgba(255, 255, 255, 0.3); border: 2px solid rgba(255,255,255,0.6); border-radius: 50%;
    box-shadow: 0 0 15px rgba(255,255,255,0.2);
  }

  #crosshair { 
    position: absolute; top: 50%; left: 50%; width: 20px; height: 20px; 
    transform: translate(-50%, -50%); border: 2px solid rgba(255, 255, 255, 0.8); 
    border-radius: 50%; z-index: 5; pointer-events: none; 
  }
  #info { position: absolute; top: 20px; width: 100%; text-align: center; color: #0ff; font-weight: bold; font-size: 20px; text-shadow: 0 0 10px #0ff; z-index: 10; pointer-events: none; }
</style>
</head>
<body>

<div id="info">پایگاه فضایی</div>
<div id="crosshair"></div>

<div id="joystick-zone"><div id="joystick-knob"></div></div>
<button id="btn-fire">FIRE</button>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';

// ================= 1. سیستم صدا (Web Audio) =================
let audioCtx = null;
function initAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
}
function playShootSound() {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'square'; // صدای تیز
  osc.frequency.setValueAtTime(800, audioCtx.currentTime); // فرکانس بالا
  osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.1); // افت سریع
  gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
  
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + 0.1);
}

// ================= 2. راه‌اندازی صحنه =================
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0a1a); 
scene.fog = new THREE.Fog(0x0a0a1a, 10, 100);

const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// نورپردازی
scene.add(new THREE.AmbientLight(0xffffff, 1.2)); // نور محیط بیشتر
const dirLight = new THREE.DirectionalLight(0xaaccff, 2); 
dirLight.position.set(10, 20, 10);
scene.add(dirLight);

// زمین
const groundGeo = new THREE.PlaneGeometry(200, 200);
const groundMat = new THREE.MeshStandardMaterial({ color: 0x1a1a2a, roughness: 0.2, metalness: 0.8 });
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI / 2;
scene.add(ground);

const gridHelper = new THREE.GridHelper(200, 40, 0x00ffff, 0x004444);
gridHelper.position.y = 0.1;
scene.add(gridHelper);

// ساختمون‌ها
const buildingMat = new THREE.MeshStandardMaterial({ color: 0x555566, metalness: 0.9, roughness: 0.4 });
const neonMat = new THREE.MeshBasicMaterial({ color: 0xff00ff }); 

function createBuilding(x, z, w, h, d) {
  const bGeo = new THREE.BoxGeometry(w, h, d);
  const building = new THREE.Mesh(bGeo, buildingMat);
  building.position.set(x, h/2, z);
  scene.add(building);
  const nGeo = new THREE.BoxGeometry(w + 0.1, 1, d + 0.1);
  const neon = new THREE.Mesh(nGeo, neonMat);
  neon.position.set(x, h - 2, z);
  scene.add(neon);
}

createBuilding(-10, -15, 10, 20, 10);
createBuilding(15, -20, 15, 30, 15);
createBuilding(-20, 10, 12, 25, 12);
createBuilding(20, 15, 10, 40, 10);

// ================= 3. متغیرهای بازیکن =================
let playerPos = new THREE.Vector3(0, 1.6, 15); // قد 1.6
let playerYaw = 0;
let playerPitch = 0;
let moveForward = 0, moveRight = 0;
let isFiring = false, fireCooldown = 0, bullets = [];

// ================= 4. سیستم جوی‌استیک لمسی =================
const joyZone = document.getElementById('joystick-zone');
const joyKnob = document.getElementById('joystick-knob');
let joyActive = false, joyCenterX = 0, joyCenterY = 0, joyMaxDist = 50;

joyZone.addEventListener('touchstart', (e) => {
  e.preventDefault(); 
  initAudio(); // فعال کردن صدا با اولین لمس
  joyActive = true;
  const rect = joyZone.getBoundingClientRect();
  joyCenterX = rect.left + rect.width / 2;
  joyCenterY = rect.top + rect.height / 2;
}, {passive: false});

document.addEventListener('touchmove', (e) => {
  // اگر در حال استفاده از جوی‌استیک هستیم
  if (joyActive) {
    e.preventDefault();
    let touch = e.touches[0];
    let dx = touch.clientX - joyCenterX;
    let dy = touch.clientY - joyCenterY;
    let dist = Math.sqrt(dx*dx + dy*dy);
    
    // محدود کردن دسته به داخل دایره
    if (dist > joyMaxDist) { 
      dx = (dx / dist) * joyMaxDist; 
      dy = (dy / dist) * joyMaxDist; 
    }
    
    // حرکت دادن دسته
    joyKnob.style.transform = `translate(${dx}px, ${dy}px)`;
    
    // محاسبه شدت حرکت
    moveRight = dx / joyMaxDist;
    moveForward = -dy / joyMaxDist;
  } 
  // اگر در حال چرخش دوربین هستیم (بیرون از جوی‌استیک)
  else if (e.target.tagName !== 'BUTTON' && !joyActive) {
    let dx = e.touches[0].clientX - lastTouchX;
    let dy = e.touches[0].clientY - lastTouchY;
    
    playerYaw -= dx * 0.005;
    playerPitch -= dy * 0.005;
    playerPitch = Math.max(-Math.PI/2 + 0.1, Math.min(Math.PI/2 - 0.1, playerPitch));
    
    lastTouchX = e.touches[0].clientX; 
    lastTouchY = e.touches[0].clientY;
  }
}, {passive: false});

let lastTouchX = 0, lastTouchY = 0;
document.addEventListener('touchstart', (e) => {
  if (e.target.tagName !== 'BUTTON' && e.target.id !== 'joystick-zone' && e.target.id !== 'joystick-knob') {
    lastTouchX = e.touches[0].clientX; 
    lastTouchY = e.touches[0].clientY;
  }
});

document.addEventListener('touchend', (e) => {
  if (joyActive) {
    joyActive = false;
    joyKnob.style.transform = 'translate(0px, 0px)';
    moveForward = 0; 
    moveRight = 0;
  }
});

// ================= 5. دکمه شلیک =================
document.getElementById('btn-fire').addEventListener('touchstart', (e) => {
  e.preventDefault(); 
  isFiring = true;
}, {passive: false});
document.getElementById('btn-fire').addEventListener('touchend', (e) => {
  e.preventDefault(); 
  isFiring = false;
}, {passive: false});

// ================= 6. گلوله =================
function shootBullet() {
  const bGeo = new THREE.SphereGeometry(0.1, 4, 4);
  const bMat = new THREE.MeshBasicMaterial({ color: 0x00ffff }); 
  const bullet = new THREE.Mesh(bGeo, bMat);
  
  const startPos = camera.position.clone();
  const dir = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
  startPos.add(dir.multiplyScalar(1));
  
  bullet.position.copy(startPos);
  bullet.userData = { velocity: dir.multiplyScalar(1.5), life: 100 };
  
  scene.add(bullet);
  bullets.push(bullet);
  
  // افکت نور
  const flashLight = new THREE.PointLight(0x00ffff, 2, 5);
  flashLight.position.copy(startPos);
  scene.add(flashLight);
  setTimeout(() => scene.remove(flashLight), 50);
}

// ================= 7. حلقه بازی =================
function animate() {
  requestAnimationFrame(animate);

  // حرکت بازیکن با جوی‌استیک
  const moveSpeed = 0.15; // سرعت راه رفتن
  const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
  forward.y = 0; forward.normalize(); // حرکت فقط افقی
  const right = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
  right.y = 0; right.normalize();

  playerPos.add(forward.multiplyScalar(moveForward * moveSpeed));
  playerPos.add(right.multiplyScalar(moveRight * moveSpeed));

  // اعمال دوربین
  camera.position.copy(playerPos);
  camera.rotation.set(playerPitch, playerYaw, 0, 'YXZ');

  // شلیک
  if (isFiring) {
    fireCooldown--;
    if (fireCooldown <= 0) {
      shootBullet();
      playShootSound(); // پخش صدا
      fireCooldown = 10; // سرعت رگبار
    }
  }

  // آپدیت گلوله‌ها
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.position.add(b.userData.velocity);
    b.userData.life--;
    if (b.userData.life <= 0) { 
      scene.remove(b); 
      bullets.splice(i, 1); 
    }
  }

  renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

animate();
</script>
</body>
</html>
