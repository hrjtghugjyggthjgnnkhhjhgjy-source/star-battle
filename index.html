<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Star Battle - نبرد ستاره‌ای</title>
<style>
* {
  margin: 0; padding: 0; box-sizing: border-box;
  font-family: Tahoma, Arial, sans-serif;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  width: 100%; height: 100%;
  background: #06060f;
  overflow: hidden;
  display: flex;
  justify-content: center;
  align-items: center;
  touch-action: none;
}

#game-container {
  position: relative;
  width: 100vw;
  height: 100vh;
  max-width: 600px;
  background: #000;
  overflow: hidden;
  box-shadow: 0 0 60px rgba(80, 150, 255, 0.3);
}

#game-canvas {
  display: block;
  width: 100%; height: 100%;
  touch-action: none;
}

.screen {
  position: absolute;
  inset: 0;
  display: none;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 10px;
  padding: 15px;
  background: linear-gradient(180deg, #0a0a1f 0%, #101030 100%);
  text-align: center;
  z-index: 10;
  overflow-y: auto;
}

.screen.active { display: flex; }

.screen h1 {
  color: #ffdc3c;
  font-size: 32px;
  text-shadow: 0 0 25px rgba(255, 220, 60, 0.7);
  margin-bottom: 5px;
}

.menu-btn {
  width: 90%;
  max-width: 300px;
  padding: 12px 15px;
  border: none;
  border-radius: 14px;
  font-size: 16px;
  font-weight: bold;
  color: #fff;
  cursor: pointer;
  box-shadow: 0 4px 0 rgba(0,0,0,0.4);
  transition: transform 0.15s;
}

.menu-btn:active { transform: translateY(3px); }

.menu-btn.green  { background: linear-gradient(180deg, #3aa864, #2a7d4a); }
.menu-btn.blue   { background: linear-gradient(180deg, #4a7fd0, #2f5da0); }
.menu-btn.orange { background: linear-gradient(180deg, #d08a3a, #a06520); }
.menu-btn.red    { background: linear-gradient(180deg, #d04a4a, #a02a2a); }
.menu-btn.gray   { background: linear-gradient(180deg, #6a6a80, #4a4a5a); }

/* انتخاب سفینه */
.ship-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
  width: 90%;
  max-width: 300px;
}

.ship-btn {
  background: rgba(255,255,255,0.05);
  border: 2px solid rgba(255,255,255,0.2);
  border-radius: 12px;
  padding: 15px 10px;
  color: #fff;
  font-weight: bold;
  font-size: 14px;
  cursor: pointer;
  transition: 0.2s;
}
.ship-btn.active {
  border-color: #ffdc3c;
  background: rgba(255, 220, 60, 0.2);
  box-shadow: 0 0 15px rgba(255, 220, 60, 0.5);
}

.help-text {
  color: #e0e0e0;
  font-size: 13px;
  line-height: 1.8;
  text-align: right;
  background: rgba(255,255,255,0.05);
  padding: 15px;
  border-radius: 14px;
  max-width: 90%;
}
.help-text b { color: #ffdc3c; }

#hud {
  position: absolute;
  top: 0; left: 0; right: 0;
  display: flex;
  justify-content: space-between;
  padding: 10px 14px;
  z-index: 5;
  pointer-events: none;
}

.hud-item {
  color: #fff;
  font-size: 13px;
  font-weight: bold;
  background: rgba(0,0,0,0.55);
  padding: 5px 10px;
  border-radius: 8px;
  border: 1px solid rgba(255,255,255,0.15);
}

#hp { color: #ff5050; }
#combo-hud {
  position: absolute; top: 55px; left: 50%;
  transform: translateX(-50%);
  color: #ffdc3c; font-size: 20px; font-weight: bold;
  text-shadow: 0 0 15px rgba(255, 220, 60, 0.8);
  z-index: 5; display: none;
}

#touch-controls {
  position: absolute; inset: 0; z-index: 6; pointer-events: none;
}

.ctrl-btn {
  position: absolute; border-radius: 50%;
  border: 3px solid rgba(255,255,255,0.5);
  background: rgba(80, 150, 255, 0.3);
  color: #fff; font-size: 18px; font-weight: bold;
  display: flex; justify-content: center; align-items: center;
  pointer-events: auto; touch-action: none;
}
.ctrl-btn:active { background: rgba(80, 150, 255, 0.9); transform: scale(0.9); }

/* چیدمان دکمه‌ها */
#btn-up    { left: 95px;  bottom: 180px; width: 65px; height: 65px; }
#btn-left  { left: 25px;  bottom: 110px; width: 65px; height: 65px; }
#btn-down  { left: 95px;  bottom: 110px; width: 65px; height: 65px; }
#btn-right { left: 165px; bottom: 110px; width: 65px; height: 65px; }

#btn-bomb {
  left: 25px; bottom: 255px; width: 70px; height: 70px;
  background: rgba(220, 130, 40, 0.4); font-size: 13px;
}
#btn-fire {
  right: 20px; bottom: 30px; width: 100px; height: 100px;
  background: rgba(220, 50, 50, 0.45); font-size: 16px;
}
#btn-auto {
  right: 130px; bottom: 30px; width: 78px; height: 78px;
  background: rgba(60, 160, 90, 0.4); font-size: 14px;
}
#btn-auto.on { background: rgba(60, 255, 90, 0.9); box-shadow: 0 0 25px rgba(60, 255, 90, 0.9); }

.hidden { display: none !important; }

@media (max-height: 700px) {
  #btn-up { bottom: 150px; width: 58px; height: 58px; left: 85px; }
  #btn-left { bottom: 90px; width: 58px; height: 58px; left: 20px; }
  #btn-down { bottom: 90px; width: 58px; height: 58px; left: 85px; }
  #btn-right { bottom: 90px; width: 58px; height: 58px; left: 150px; }
  #btn-bomb { width: 62px; height: 62px; bottom: 215px; left: 20px; font-size: 11px; }
  #btn-fire { width: 88px; height: 88px; }
  #btn-auto { width: 68px; height: 68px; right: 115px; }
}
</style>
</head>
<body>

<div id="game-container">
  <canvas id="game-canvas"></canvas>

  <!-- منوی اصلی -->
  <div id="menu-screen" class="screen active">
    <h1>نبرد ستاره‌ای</h1>
    <button class="menu-btn green"  data-action="start">شروع بازی</button>
    <button class="menu-btn blue"   data-action="skin">انتخاب سفینه 🚀</button>
    <button class="menu-btn orange" data-action="help">راهنما</button>
  </div>

  <!-- انتخاب سفینه -->
  <div id="skin-screen" class="screen">
    <h1>سفینه‌ت رو انتخاب کن</h1>
    <div class="ship-grid">
      <button class="ship-btn active" data-ship="jet">✈️ جت جنگنده</button>
      <button class="ship-btn" data-ship="spaceship">🛸 سفینه فضایی</button>
      <button class="ship-btn" data-ship="heli">🚁 هلیکوپتر</button>
      <button class="ship-btn" data-ship="ufo">👽 بشقاب پرنده</button>
    </div>
    <button class="menu-btn gray" data-action="back" style="margin-top: 15px;">بازگشت</button>
  </div>

  <!-- راهنما -->
  <div id="help-screen" class="screen">
    <h1>راهنما</h1>
    <div class="help-text">
      <p>🎮 <b>حرکت:</b> دکمه‌های جهت‌دار</p>
      <p>🔫 <b>شلیک:</b> دکمه FIRE</p>
      <p>🤖 <b>AUTO:</b> شلیک خودکار</p>
      <p>💣 <b>BOMB:</b> نابودی دشمن‌ها</p>
      <p>🔥 <b>COMBO:</b> پشت سر هم بزن!</p>
    </div>
    <button class="menu-btn gray" data-action="back">بازگشت</button>
  </div>

  <!-- پایان بازی -->
  <div id="gameover-screen" class="screen">
    <h1 style="color:#ff5050;">بازی تموم شد!</h1>
    <p style="color:#fff; font-size: 20px;">امتیاز: <span id="final-score" style="color:#ffdc3c; font-weight:bold;">0</span></p>
    <p style="color:#aaa;">بهترین رکورد: <span id="best-score" style="color:#4ad07a; font-weight:bold;">0</span></p>
    <button class="menu-btn green" data-action="restart" style="margin-top:15px;">تلاش مجدد</button>
    <button class="menu-btn gray"  data-action="menu">بازگشت به منو</button>
  </div>

  <!-- HUD -->
  <div id="hud" class="hidden">
    <div class="hud-item">امتیاز: <span id="score">0</span></div>
    <div class="hud-item">سطح: <span id="level">1</span></div>
    <div class="hud-item">جان: <span id="hp">**********</span></div>
  </div>
  <div id="combo-hud"></div>

  <!-- کنترل‌ها -->
  <div id="touch-controls" class="hidden">
    <button class="ctrl-btn" id="btn-up">▲</button>
    <button class="ctrl-btn" id="btn-left">◀</button>
    <button class="ctrl-btn" id="btn-right">▶</button>
    <button class="ctrl-btn" id="btn-down">▼</button>
    <button class="ctrl-btn" id="btn-fire">FIRE</button>
    <button class="ctrl-btn" id="btn-auto">AUTO</button>
    <button class="ctrl-btn" id="btn-bomb">BOMB</button>
  </div>
</div>

<script>
const canvas = document.getElementById('game-canvas');
const ctx = canvas.getContext('2d');

function resizeCanvas() {
  const rect = canvas.parentElement.getBoundingClientRect();
  canvas.width = rect.width;
  canvas.height = rect.height;
}
window.addEventListener('resize', resizeCanvas);

const COLORS = {
  bg: '#06060f', white: '#ffffff', red: '#dc3232', darkRed: '#96201e',
  blue: '#5096ff', lightBlue: '#64aaff', yellow: '#ffdc3c', gray: '#78788c',
  green: '#3cc85a', purple: '#b450dc', orange: '#ff9632', pink: '#ff64b4',
  cyan: '#50dcdc', gold: '#ffc832',
};

const STATE = { MENU: 'menu', PLAY: 'play', SKIN: 'skin', HELP: 'help', GAMEOVER: 'gameover' };
let state = STATE.MENU;
let currentShip = 'jet'; // پیش‌فرض
let bestScore = parseInt(localStorage.getItem('sb_best') || '0');

const input = { left: false, right: false, up: false, down: false, fire: false, auto: false };

// کیبورد
window.addEventListener('keydown', e => {
  if (e.code === 'Space') { input.fire = true; e.preventDefault(); }
  if (e.key === 'ArrowLeft' || e.key.toLowerCase() === 'a') input.left = true;
  if (e.key === 'ArrowRight' || e.key.toLowerCase() === 'd') input.right = true;
  if (e.key === 'ArrowUp' || e.key.toLowerCase() === 'w') input.up = true;
  if (e.key === 'ArrowDown' || e.key.toLowerCase() === 's') input.down = true;
});
window.addEventListener('keyup', e => {
  if (e.code === 'Space') input.fire = false;
  if (e.key === 'ArrowLeft' || e.key.toLowerCase() === 'a') input.left = false;
  if (e.key === 'ArrowRight' || e.key.toLowerCase() === 'd') input.right = false;
  if (e.key === 'ArrowUp' || e.key.toLowerCase() === 'w') input.up = false;
  if (e.key === 'ArrowDown' || e.key.toLowerCase() === 's') input.down = false;
});

// ==================== رسم سفینه‌های جدید ====================
function drawShip(x, y, w, h, type) {
  ctx.save();
  ctx.translate(x + w/2, y + h/2); // مرکز سفینه
  
  if (type === 'jet') {
    // جت جنگنده
    ctx.fillStyle = COLORS.cyan;
    ctx.beginPath();
    ctx.moveTo(0, -h/2); // دماغه
    ctx.lineTo(-w/4, 0);
    ctx.lineTo(-w/2, h/3); // بال چپ
    ctx.lineTo(-w/6, h/4);
    ctx.lineTo(-w/6, h/2); // دم
    ctx.lineTo(w/6, h/2);
    ctx.lineTo(w/6, h/4);
    ctx.lineTo(w/2, h/3); // بال راست
    ctx.lineTo(w/4, 0);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = COLORS.white; ctx.lineWidth = 2; ctx.stroke();
    // کابین
    ctx.fillStyle = '#004488';
    ctx.beginPath(); ctx.arc(0, -h/6, w/8, 0, Math.PI*2); ctx.fill();
    
  } else if (type === 'spaceship') {
    // سفینه فضایی (مثل X-Wing)
    ctx.fillStyle = COLORS.orange;
    ctx.beginPath();
    ctx.moveTo(0, -h/2); // دماغه
    ctx.lineTo(w/4, -h/6);
    ctx.lineTo(w/2, h/4); // بال راست
    ctx.lineTo(w/6, h/4);
    ctx.lineTo(w/6, h/2);
    ctx.lineTo(-w/6, h/2);
    ctx.lineTo(-w/6, h/4);
    ctx.lineTo(-w/2, h/4); // بال چپ
    ctx.lineTo(-w/4, -h/6);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = COLORS.white; ctx.lineWidth = 2; ctx.stroke();
    // موتورها
    ctx.fillStyle = COLORS.red;
    ctx.fillRect(-w/4, h/2 - 5, w/6, 8);
    ctx.fillRect(w/12, h/2 - 5, w/6, 8);
    
  } else if (type === 'heli') {
    // هلیکوپتر
    ctx.fillStyle = COLORS.green;
    ctx.beginPath();
    ctx.ellipse(0, 0, w/3, h/2.5, 0, 0, Math.PI*2); // بدنه
    ctx.fill();
    ctx.strokeStyle = COLORS.white; ctx.lineWidth = 2; ctx.stroke();
    // پره‌ها
    ctx.fillStyle = COLORS.gray;
    ctx.fillRect(-w/2, -h/2, w, 4); // پره اصلی
    ctx.beginPath(); ctx.arc(0, -h/2 + 2, 4, 0, Math.PI*2); ctx.fill(); // مرکز پره
    // دم
    ctx.fillStyle = COLORS.green;
    ctx.fillRect(-4, h/4, 8, h/3);
    ctx.fillRect(-w/4, h/2 + h/6, w/2, 4); // پره دم
    
  } else if (type === 'ufo') {
    // بشقاب پرنده
    ctx.fillStyle = COLORS.purple;
    ctx.beginPath();
    ctx.ellipse(0, h/4, w/2, h/3, 0, 0, Math.PI*2); // بشقاب
    ctx.fill();
    ctx.strokeStyle = COLORS.white; ctx.lineWidth = 2; ctx.stroke();
    // گنبد
    ctx.fillStyle = COLORS.cyan;
    ctx.beginPath();
    ctx.arc(0, h/4 - h/4, w/4, Math.PI, 0);
    ctx.fill();
    ctx.stroke();
    // چراغ‌ها
    ctx.fillStyle = COLORS.yellow;
    for(let i=-1; i<=1; i++) {
        ctx.beginPath(); ctx.arc(i*w/3, h/4, 3, 0, Math.PI*2); ctx.fill();
    }
  }
  ctx.restore();
}

// ==================== کلاس‌ها ====================
class Player {
  constructor() {
    this.w = 45; this.h = 55;
    this.x = canvas.width / 2 - this.w / 2;
    this.y = canvas.height - 300;
    this.hp = 10; this.maxHp = 10;
    this.cooldown = 0; this.bombs = 5;
  }
  update() {
    const s = 7;
    if (input.left)  this.x -= s;
    if (input.right) this.x += s;
    if (input.up)    this.y -= s;
    if (input.down)  this.y += s;
    this.x = Math.max(5, Math.min(canvas.width - this.w - 5, this.x));
    this.y = Math.max(60, Math.min(canvas.height - 180, this.y));
    if (this.cooldown > 0) this.cooldown--;
  }
  draw() {
    drawShip(this.x, this.y, this.w, this.h, currentShip);
  }
  rect() { return { x: this.x, y: this.y, w: this.w, h: this.h }; }
}

class Bullet {
  constructor(x, y, isEnemy = false) {
    this.x = x; this.y = y;
    this.w = 6; this.h = 15;
    this.isEnemy = isEnemy;
    this.color = isEnemy ? COLORS.red : COLORS.yellow;
  }
  update() { this.y += this.isEnemy ? 6 : -12; }
  draw() {
    ctx.fillStyle = this.color;
    ctx.fillRect(this.x, this.y, this.w, this.h);
  }
  offScreen() { return this.isEnemy ? this.y > canvas.height : this.y < -20; }
  rect() { return { x: this.x, y: this.y, w: this.w, h: this.h }; }
}

class Enemy {
  constructor(type) {
    this.type = type;
    this.w = 35; this.h = 35;
    this.x = Math.random() * (canvas.width - this.w);
    this.y = -this.h;
    this.moveDir = Math.random() < 0.5 ? 1 : -1;
    
    if (type === 'drone') { // پهباد (کوچیک و سریع)
      this.w = 25; this.h = 25; this.speed = 1.5; this.hp = 1;
      this.color = COLORS.yellow;
    } else if (type === 'jet') { // جنگنده
      this.speed = 1.0; this.hp = 2; this.color = COLORS.red;
    } else { // معمولی
      this.speed = 0.7; this.hp = 1; this.color = COLORS.purple;
    }
  }
  update() {
    this.y += this.speed;
    this.x += 0.5 * this.moveDir;
    if (this.x <= 0 || this.x + this.w >= canvas.width) this.moveDir *= -1;
  }
  draw() {
    // برای دشمن‌ها هم از تابع drawShip استفاده می‌کنیم ولی رنگ‌شون فرق داره (چون تابع رنگ ثابت داره، فعلا ساده رسم میکنیم)
    // برای سادگی، دشمن‌ها رو مثلث با استایل جدید رسم میکنیم
    ctx.fillStyle = this.color;
    ctx.beginPath();
    if(this.type === 'drone') {
        ctx.arc(this.x + this.w/2, this.y + this.h/2, this.w/2, 0, Math.PI*2); // پهباد دایره‌ای
    } else {
        ctx.moveTo(this.x + this.w/2, this.y + this.h);
        ctx.lineTo(this.x, this.y);
        ctx.lineTo(this.x + this.w, this.y);
    }
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = COLORS.white; ctx.lineWidth = 2; ctx.stroke();
  }
  offScreen() { return this.y > canvas.height; }
  rect() { return { x: this.x, y: this.y, w: this.w, h: this.h }; }
}

// ==================== داده‌ها ====================
let player, bullets, enemyBullets, enemies;
let score = 0, spawnTimer = 0, spawnDelay = 90, level = 1;

function rectsCollide(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

function startGame() {
  player = new Player();
  bullets = []; enemyBullets = []; enemies = [];
  score = 0; spawnTimer = 0; level = 1; spawnDelay = 90;
  state = STATE.PLAY;
  showScreen(null);
  document.getElementById('hud').classList.remove('hidden');
  document.getElementById('touch-controls').classList.remove('hidden');
}

function gameOver() {
  bestScore = Math.max(bestScore, score);
  localStorage.setItem('sb_best', bestScore);
  document.getElementById('final-score').textContent = score;
  document.getElementById('best-score').textContent = bestScore;
  state = STATE.GAMEOVER;
  showScreen('gameover-screen');
  document.getElementById('hud').classList.add('hidden');
  document.getElementById('touch-controls').classList.add('hidden');
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  if (id) document.getElementById(id).classList.add('active');
}

// ==================== حلقه بازی ====================
let stars = [];
for (let i = 0; i < 80; i++) stars.push({ x: Math.random()*600, y: Math.random()*800, s: Math.random()*2+1 });

function gameLoop() {
  requestAnimationFrame(gameLoop);

  // پس زمینه
  ctx.fillStyle = COLORS.bg;
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = '#fff';
  for (let s of stars) {
    s.y += s.s;
    if (s.y > canvas.height) { s.y = 0; s.x = Math.random()*canvas.width; }
    ctx.fillRect(s.x, s.y, s.s, s.s);
  }

  if (state === STATE.PLAY && player) {
    player.update();

    // شلیک
    if ((input.fire || input.auto) && player.cooldown === 0) {
      bullets.push(new Bullet(player.x + player.w/2 - 3, player.y));
      player.cooldown = 8;
    }

    // آپدیت گلوله‌ها
    for (let i = bullets.length - 1; i >= 0; i--) {
      bullets[i].update();
      if (bullets[i].offScreen()) bullets.splice(i, 1);
    }

    // اسپاون دشمن
    spawnTimer++;
    if (spawnTimer >= spawnDelay) {
      let r = Math.random();
      let type = r < 0.3 ? 'drone' : (r < 0.7 ? 'jet' : 'normal');
      enemies.push(new Enemy(type));
      spawnTimer = 0;
    }

    // آپدیت دشمن‌ها
    for (let i = enemies.length - 1; i >= 0; i--) {
      let e = enemies[i];
      e.update();
      if (e.offScreen()) {
        enemies.splice(i, 1);
        player.hp--;
        if (player.hp <= 0) return gameOver();
      }
    }

    // برخورد گلوله با دشمن
    for (let i = bullets.length - 1; i >= 0; i--) {
      for (let j = enemies.length - 1; j >= 0; j--) {
        if (rectsCollide(bullets[i].rect(), enemies[j].rect())) {
          bullets.splice(i, 1);
          enemies[j].hp--;
          if (enemies[j].hp <= 0) {
            enemies.splice(j, 1);
            score += 10;
          }
          break;
        }
      }
    }

    // برخورد دشمن با بازیکن
    for (let i = enemies.length - 1; i >= 0; i--) {
      if (rectsCollide(enemies[i].rect(), player.rect())) {
        enemies.splice(i, 1);
        player.hp--;
        if (player.hp <= 0) return gameOver();
      }
    }

    // رسم دشمن‌ها
    for (let e of enemies) e.draw();
    // رسم گلوله‌ها
    for (let b of bullets) b.draw();
    // رسم بازیکن
    player.draw();

    // HUD
    document.getElementById('score').textContent = score;
    document.getElementById('hp').textContent = '*'.repeat(Math.max(0, player.hp));
  }
}

// ==================== دکمه‌ها ====================
document.querySelectorAll('[data-action]').forEach(btn => {
  btn.addEventListener('click', () => {
    const action = btn.dataset.action;
    if (action === 'start') startGame();
    else if (action === 'skin') { state = STATE.SKIN; showScreen('skin-screen'); }
    else if (action === 'help') { state = STATE.HELP; showScreen('help-screen'); }
    else if (action === 'back') { state = STATE.MENU; showScreen('menu-screen'); }
    else if (action === 'restart') startGame();
    else if (action === 'menu') { state = STATE.MENU; showScreen('menu-screen'); }
  });
});

// انتخاب سفینه
document.querySelectorAll('[data-ship]').forEach(btn => {
  btn.addEventListener('click', () => {
    currentShip = btn.dataset.ship;
    document.querySelectorAll('[data-ship]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  });
});

// تاچ
const touchMap = { 'btn-left': 'left', 'btn-right': 'right', 'btn-up': 'up', 'btn-down': 'down', 'btn-fire': 'fire' };
Object.keys(touchMap).forEach(id => {
  const btn = document.getElementById(id);
  const key = touchMap[id];
  btn.addEventListener('touchstart', e => { e.preventDefault(); input[key] = true; btn.style.background = 'rgba(80,150,255,0.9)'; });
  btn.addEventListener('touchend', e => { e.preventDefault(); input[key] = false; btn.style.background = ''; });
  btn.addEventListener('mousedown', () => input[key] = true);
  btn.addEventListener('mouseup', () => input[key] = false);
});

document.getElementById('btn-auto').addEventListener('click', function() {
  input.auto = !input.auto;
  this.classList.toggle('on', input.auto);
});
document.getElementById('btn-bomb').addEventListener('click', function() {
  if (state === STATE.PLAY && player && player.bombs > 0) {
    player.bombs--;
    for(let e of enemies) score += 10;
    enemies = [];
  }
});

resizeCanvas();
gameLoop();
</script>
</body>
</html>
