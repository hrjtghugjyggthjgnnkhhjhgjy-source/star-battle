<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Star Battle 3D</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="info">حالت: پرواز با سفینه</div>
<div id="ui">
  <button class="btn" id="btn-switch">SWITCH<br>پیاده/سوار</button>
  <button class="btn" id="btn-fire">FIRE</button>
</div>

<!-- لود کردن کتابخانه Three.js -->
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';

// 1. راه‌اندازی صحنه، دوربین و رندر
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x050510);

const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// 2. ساخت زمین و نور
const gridHelper = new THREE.GridHelper(200, 50, 0x5096ff, 0x222244);
scene.add(gridHelper);
const ambientLight = new THREE.AmbientLight(0xffffff, 1.5);
scene.add(ambientLight);

// 3. ساخت سفینه
const ship = new THREE.Mesh(
  new THREE.BoxGeometry(2, 1, 4),
  new THREE.MeshStandardMaterial({ color: 0x50dcdc })
);
ship.position.set(0, 2, 0);
scene.add(ship);

// 4. متغیرهای وضعیت
let isPiloting = true;
let touchX = 0, touchY = 0;
let isMoving = false;
let moveForward = 0;

// 5. تنظیمات ورودی لمسی
document.addEventListener('touchstart', (e) => { touchX = e.touches[0].clientX; touchY = e.touches[0].clientY; });
document.addEventListener('touchmove', (e) => {
  const dx = e.touches[0].clientX - touchX;
  const dy = e.touches[0].clientY - touchY;
  touchX = e.touches[0].clientX; touchY = e.touches[0].clientY;

  if (isPiloting) {
    ship.rotation.y -= dx * 0.005;
    ship.rotation.x -= dy * 0.003;
  } else {
    camera.rotation.y -= dx * 0.005;
    camera.rotation.x -= dy * 0.005;
    camera.rotation.x = Math.max(-Math.PI/2, Math.min(Math.PI/2, camera.rotation.x));
  }
});

// 6. دکمه‌ها
document.getElementById('btn-switch').addEventListener('touchstart', (e) => {
  e.preventDefault();
  isPiloting = !isPiloting;
  document.getElementById('info').innerText = isPiloting ? 'حالت: پرواز با سفینه' : 'حالت: پیاده نظام';
});

document.getElementById('btn-fire').addEventListener('touchstart', (e) => {
  e.preventDefault();
});
document.getElementById('btn-fire').addEventListener('touchend', (e) => {
  e.preventDefault();
});

// 7. حلقه بازی (Game Loop)
function animate() {
  requestAnimationFrame(animate);

  if (isPiloting) {
    // حرکت سفینه به جلو با یک سرعت ثابت (شبیه شبیه‌ساز پرواز)
    const forward = new THREE.Vector3(0, 0, -1);
    forward.applyQuaternion(ship.quaternion);
    ship.position.add(forward.multiplyScalar(0.2)); // سرعت حرکت

    // دوربین پشت سفینه
    const relativeOffset = new THREE.Vector3(0, 5, 10);
    relativeOffset.applyQuaternion(ship.quaternion);
    camera.position.copy(ship.position).add(relativeOffset);
    camera.lookAt(ship.position);
  } else {
    // دوربین اول‌شخص (پیاده)
    camera.position.copy(ship.position);
    camera.position.y += 1.5; 
  }

  renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

animate();
</script>
</body>
</html>
